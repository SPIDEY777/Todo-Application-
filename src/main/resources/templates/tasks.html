<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center">Todo Application</h1>

    <form action="/" method="post" class="row mt-3">
        <div class="col-md-10">
            <input class="form-control" type="text" name="title" placeholder="Add a new task..." required/>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Task</button>
        </div>
    </form>

    <ul class="list-group mt-4">
        <li th:each="task : ${tasks}" class="list-group-item d-flex justify-content-between align-items-center">
            <span th:text="${task.title}" th:style="${task.completed} ? 'text-decoration: line-through;' : ''">Task Title</span>

            <div>
                <a th:href="@{/{id}/toggle(id=${task.id})}" class="btn btn-sm btn-success me-2">Toggle</a>
                <a th:href="@{/{id}/delete(id=${task.id})}" class="btn btn-sm btn-danger">Delete</a>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
